name: PR title

# The PR title becomes the squash commit on develop: it must be a Conventional Commit (#258).
# `edited` reruns the check when the title changes.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    uses: qiick-io/app-ui/.github/workflows/pr-title.yml@v0.6.0
