name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The Larastan ratchet compares the baseline with the base branch.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # Before Pest and the type check: the tests need the Vite manifest, and the build generates
      # the Wayfinder route helpers that `npm run types` reads.
      - name: Build
        run: npm run build

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Larastan baseline only shrinks
        run: node scripts/qiick-ratchet.mjs phpstan

      - name: Pest
        run: php artisan test

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run types

      - name: Dead code (knip)
        run: npm run knip

      - name: Hard-coded UI strings (ratchet)
        run: npm run lint:i18n

      # The qiick ratcheted rules (#258) in Oxlint: restricted imports, navigator.clipboard,
      # id-length. The type-aware boolean prefix rule waits for typescript-eslint on TypeScript 7.
      - name: qiick standards rules (ratchet)
        run: npm run lint:standards

  # The full suite on the other supported databases (#136); the `tests` job covers SQLite.
  databases:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL
            image: mysql:8.0
            connection: mysql
            port: 3306
            health: mysqladmin ping -h 127.0.0.1
          - name: PostgreSQL
            image: postgres:17
            connection: pgsql
            port: 5432
            health: pg_isready -U excubia
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_DATABASE: excubia
          MYSQL_USER: excubia
          MYSQL_PASSWORD: excubia
          MYSQL_ROOT_PASSWORD: excubia
          POSTGRES_DB: excubia
          POSTGRES_USER: excubia
          POSTGRES_PASSWORD: excubia
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_CONNECTION: ${{ matrix.connection }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: excubia
      DB_USERNAME: excubia
      DB_PASSWORD: excubia
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.4-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # The tests need the Vite manifest.
      - name: Build
        run: npm run build

      # The DB_* job variables override the SQLite defaults of phpunit.xml.
      - name: Pest
        run: php artisan test

  contract:
    name: Core contract (${{ matrix.core }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        core:
          - '^1.0@beta'
          - 'dev-develop'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-contract-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-contract-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Serves this app, installs qiick/excubia-core in a throwaway Laravel app and pushes to it.
      - name: End-to-end contract test
        run: scripts/e2e/core-contract.sh '${{ matrix.core }}'

  # Install and upgrade as an operator does it (qiick standards, as externa-core):
  # create-project from this checkout, `excubia:install -n`, the health probes, `excubia:upgrade`,
  # and, once a release tag exists, an upgrade from the previous release.
  install-upgrade:
    name: Install and upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release tags, for the upgrade from the previous release.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-install-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-install-${{ runner.os }}-

      - name: Install and upgrade smoke test
        run: scripts/e2e/install-upgrade.sh

  # Forward-only migrations (#193): a migration on `main`, on the latest `v*` tag or in the
  # freeze baseline `database/migrations/.frozen` is never modified, renamed or deleted.
  migrations-frozen:
    name: Migrations frozen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release tags, `main` and the base branch.
          fetch-depth: 0

      - name: Check frozen migrations
        run: scripts/migrations-frozen.sh "${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}"

  # Axe smoke (#112), as in externa-core: pull requests to `develop` run only the smoke test ("lite");
  # pushes and pull requests to `main` run every browser test. Not part of `php artisan test`.
  accessibility:
    name: Accessibility
    # ponytail: pinned to 24.04 while ubuntu-latest (26.04) runners cannot resolve
    # security.ubuntu.com for the Playwright system packages (2026-11-11); back to
    # ubuntu-latest once its mirrors answer again.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, sockets
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.4-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Build
        run: npm run build

      - name: Axe smoke (PR → develop)
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        run: vendor/bin/pest tests/Browser/A11ySmokeBrowserTest.php

      - name: Browser tests
        if: github.event_name != 'pull_request' || github.base_ref != 'develop'
        run: vendor/bin/pest tests/Browser

  # Theme tokens and the WCAG 2.2 AA contrast of the installed theme, from app-ui at the pinned
  # ref (#258). The browser tests stay in the Accessibility job above (full suite on main).
  ui-quality:
    uses: qiick-io/app-ui/.github/workflows/ui-quality.yml@v0.6.0

  # The shared forward-only migration check (#258). It runs next to the `Migrations frozen` job
  # until the required checks name it; then the local job and scripts/migrations-frozen.sh go.
  shared-migrations-frozen:
    uses: qiick-io/app-ui/.github/workflows/migrations-frozen.yml@v0.6.0

  # The @qiick UI registry copies and the qiick standards pack (agent files,
  # architecture test, kebab-case file names) must match app-ui.
  app-ui-drift:
    uses: qiick-io/app-ui/.github/workflows/drift-check.yml@v0.6.0
    with:
      standards: true
