# Excubia App with SQLite on a volume (#116): web server, queue worker and scheduler.
#
#   docker compose up -d
#   open http://localhost:8080/setup
#
# Put a TLS reverse proxy in front for production (projects push over HTTPS only), set APP_URL
# to its public URL and TRUSTED_PROXIES to the proxy address (or "*"). See docs/install.md.
x-excubia: &excubia
  build: .
  image: ${EXCUBIA_IMAGE:-excubia-app:local}
  restart: unless-stopped
  environment: &environment
    APP_URL: ${APP_URL:-http://localhost:8080}
    APP_KEY: ${APP_KEY:-}
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    MAIL_MAILER: ${MAIL_MAILER:-log}
    MAIL_HOST: ${MAIL_HOST:-}
    MAIL_PORT: ${MAIL_PORT:-587}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-excubia@example.com}
  volumes:
    - excubia-storage:/app/storage

services:
  app:
    <<: *excubia
    ports:
      - "${EXCUBIA_PORT:-8080}:8080"

  # Waits for the app, which runs the migrations, then works the database queue.
  queue:
    <<: *excubia
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
    environment:
      <<: *environment
      EXCUBIA_RUN_MIGRATIONS: "false"
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *excubia
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *environment
      EXCUBIA_RUN_MIGRATIONS: "false"
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

volumes:
  excubia-storage:
